</script><script>
/* Rosario de dos — navegador moderno + ntfy. Sin backend propio.
   La sala utiliza una clave aleatoria en el fragmento #s=... del enlace.
   Los eventos de sincronización se cifran con AES-GCM mediante WebCrypto.
   Los avisos móviles de ntfy son separados del estado compartido. */
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const meNames={i:'Isaac',z:'Zayra'},other=w=>w==='i'?'z':'i',ORDEN=['1.º','2.º','3.º','4.º','5.º'];
const todayType=()=>[3,0,2,3,1,2,0][new Date().getDay()];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||'id-'+Math.random().toString(36).slice(2)+Date.now();
const rand=()=>Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn(e)}};
const read=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let seed=(new URLSearchParams(location.hash.slice(1))).get('s');
if(!seed||!/^[0-9a-f]{48}$/.test(seed)){seed=rand();history.replaceState(null,'',location.pathname+location.search+'#s='+seed)}
const room='rdd-'+seed.slice(0,22),pushTopic=w=>room+'-aviso-'+(w==='i'?'1':'2'),prefix='rdd-final-'+seed.slice(0,22)+'-';
let my=null,screen='home',currentMonth=new Date(),online=false,lastPeer={i:0,z:0},source=null,heartbeat=null,key=null,seen=read(prefix+'seen',[]),pending=null,pushError=null,connectionError='',lastToast='',requestModal=null,activeSessionAtStart='';
let reflexOpen={},lastMystery=-1;
let settings=read(prefix+'settings',{theme:'auto',font:21}),historyItems=read(prefix+'history',[]),deleted=read(prefix+'deleted',{}),privateInt=read(prefix+'private',{}),state=read(prefix+'state',null);
const blank=()=>({phase:'welcome',proposal:null,session:null,mystery:todayType(),confirmed:{i:false,z:false},change:null,commits:{i:false,z:false},intents:{i:null,z:null},revealReady:{i:false,z:false},offeringReady:{i:false,z:false},step:0,stepDone:{i:false,z:false},starter:'i',startedAt:null,endedAt:null,undo:null,updatedAt:0});
if(!state)state=blank();
function save(){store(prefix+'state',state);store(prefix+'private',privateInt);store(prefix+'history',historyItems);store(prefix+'deleted',deleted);store(prefix+'settings',settings);store(prefix+'seen',seen.slice(-900))}
function applySettings(){document.documentElement.dataset.theme=settings.theme==='auto'?'':settings.theme;document.documentElement.style.setProperty('--size',settings.font+'px')};applySettings();
async function derive(){const bytes=new TextEncoder().encode(seed);const digest=await crypto.subtle.digest('SHA-256',bytes);key=await crypto.subtle.importKey('raw',digest,'AES-GCM',false,['encrypt','decrypt'])}
function b64(a){return btoa(String.fromCharCode(...a))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function encrypt(data){const iv=crypto.getRandomValues(new Uint8Array(12));const ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data))));return JSON.stringify({v:1,iv:b64(iv),ct:b64(ciphertext)})}
async function decrypt(s){const x=JSON.parse(s);if(x.v!==1)return null;return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},key,unb64(x.ct))))}
function showError(msg){connectionError=msg;renderBanner()}
function renderBanner(){let b=$('#banner');const msg=pushError?'No se pudo enviar la notificación.':(!online?'Sin conexión ❤️ Tu rosario está guardado. Reconectando…':connectionError);b.hidden=!msg;if(msg)b.innerHTML=esc(msg)+(pushError?' <button data-action="retry-push">Reintentar</button>':connectionError?' <button data-action="sync">Sincronizar</button>':'')}
async function publishWire(ev){const body=await encrypt(ev);const res=await fetch('https://ntfy.sh/'+room,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});if(!res.ok)throw Error('ntfy respondió '+res.status);return true}
async function send(kind,data={}){if(!my||!online){showError('Sin conexión: puedes leer la oración, pero no avanzar hasta reconectar.');return false}const ev={id:uid(),session:state.session?.id||'',from:my,kind,data,time:Date.now()};try{await publishWire(ev);acceptEvent(ev);return true}catch(err){showError('No se pudo sincronizar: '+err.message);return false}}
let inFlight=false;async function sendAndWait(kind,data){if(inFlight)return false;inFlight=true;render();try{return await send(kind,data)}finally{inFlight=false;render()}}
function touch(){state.updatedAt=Date.now();save()}
function sessionReady(){return state.phase!=='welcome' && !!state.session}
function turnOwner(p){if(p.o==='x')return'x';if(p.o==='a')return state.starter;return other(state.starter)}
function advance(){while(state.step<TOTAL){const p=PARTS[state.step];if(p.kind==='intent'){state.step++;continue}const owner=turnOwner(p);if(owner==='x'){if(!state.stepDone.i||!state.stepDone.z)break}else if(!state.stepDone[owner])break;state.step++;state.stepDone={i:false,z:false}}if(state.step>=TOTAL&&state.phase==='prayer'){state.phase='finished';state.endedAt=new Date().toISOString();addHistory()}}
function addHistory(){const s=state.session;if(!s||historyItems.some(h=>h.id===s.id)||deleted[s.id])return;historyItems.push({id:s.id,date:state.startedAt||new Date().toISOString(),end:state.endedAt||new Date().toISOString(),mystery:state.mystery,starter:state.starter,intents:{...state.intents}});save()}
function mergeHistory(items){let count=0;for(const h of items||[]){if(!h||typeof h.id!=='string'||deleted[h.id]||historyItems.some(a=>a.id===h.id))continue;historyItems.push(h);count++}save();return count}
function acceptEvent(ev){if(!ev||seen.includes(ev.id)||!ev.kind)return;seen.push(ev.id);if(seen.length>900)seen=seen.slice(-900);lastPeer[ev.from]=Date.now();
  switch(ev.kind){
  case'hello':lastPeer[ev.from]=Date.now();save();renderPeople();return;
  case'syncAsk':if(ev.from!==my&&(state.session||state.proposal))queueSnapshot();break;
  case'snapshot':if(ev.data?.state&&ev.data.state.updatedAt>state.updatedAt+600){state=ev.data.state;mergeHistory((ev.data.history||[]).filter(x=>!deleted[x.id]));}break;
  case'propose':if(state.phase==='welcome'&&!state.proposal)state.proposal={by:ev.from,id:ev.data.id,starter:ev.data.starter,created:ev.time};break;
  case'cancel':case'decline':if(state.phase==='welcome'&&state.proposal?.id===ev.data.id)state.proposal=null;break;
  case'accept':if(state.phase==='welcome'&&state.proposal?.id===ev.data.id){let p=state.proposal;state=blank();state.session={id:p.id};state.phase='mysteries';state.starter=p.starter;state.mystery=todayType();state.confirmed={i:false,z:false};}break;
  case'mysteryApprove':if(state.phase==='mysteries'&&!state.change&&ev.session===state.session?.id){state.confirmed[ev.from]=true;if(state.confirmed.i&&state.confirmed.z)state.phase='intent'}break;
  case'changeRequest':if(state.phase==='mysteries'&&ev.session===state.session?.id)state.change={by:ev.from,type:ev.data.type};break;
  case'changeDecision':if(state.phase==='mysteries'&&state.change&&ev.session===state.session?.id){if(ev.data.accept){state.mystery=state.change.type;state.confirmed={i:false,z:false}}state.change=null;}break;
  case'intentCommit':if(state.phase==='intent'&&ev.session===state.session?.id){state.commits[ev.from]=true;setTimeout(maybeReveal,550)}break;
  case'intentReveal':if(['intent','reveal'].includes(state.phase)&&ev.session===state.session?.id&&state.commits.i&&state.commits.z){state.intents[ev.from]=String(ev.data.text||'');if(state.intents.i!==null&&state.intents.z!==null){state.phase='reveal';if(!state._intentNotified){state._intentNotified=true;if(my==='i')pushIntentions()}}}break;
  case'revealNext':if(state.phase==='reveal'&&ev.session===state.session?.id){state.revealReady[ev.from]=true;if(state.revealReady.i&&state.revealReady.z)state.phase='offering'}break;
  case'offeringNext':if(state.phase==='offering'&&ev.session===state.session?.id){state.offeringReady[ev.from]=true;if(state.offeringReady.i&&state.offeringReady.z){state.phase='prayer';state.startedAt=new Date().toISOString();state.step=0;state.stepDone={i:false,z:false};advance()}}break;
  case'done':if(state.phase==='prayer'&&ev.session===state.session?.id&&ev.data.step===state.step){const p=PARTS[state.step];if(turnOwner(p)==='x'||turnOwner(p)===ev.from){state.stepDone[ev.from]=true;advance();}}break;
  case'undoAsk':if(state.phase==='prayer'&&ev.session===state.session?.id){state.undo={by:ev.from,step:ev.data.step};if(ev.from!==my)requestModal={type:'undo',from:ev.from};}break;
  case'undoDecision':if(state.phase==='prayer'&&state.undo&&ev.session===state.session?.id){if(ev.data.accept){state.step=Math.max(0,state.undo.step);state.stepDone={i:false,z:false}}state.undo=null;requestModal=null;}break;
  case'newFromFinished':if(state.phase==='finished'){state=blank();state.proposal=null;}break;
  case'historyRequest':if(ev.from!==my&&my&&historyItems.length)requestModal={type:'transfer',from:ev.from,request:ev.data.request};break;
  case'historyTransfer':if(ev.data.to===my){const n=mergeHistory(ev.data.items);notice('Se recuperaron '+n+' registros del historial.')}break;
  case'deleteAsk':if(ev.from!==my)requestModal={type:'delete',id:ev.data.id,from:ev.from};break;
  case'deleteApprove':deleted[ev.data.id]=true;historyItems=historyItems.filter(h=>h.id!==ev.data.id);if(requestModal?.id===ev.data.id)requestModal=null;break;
  case'deleteReject':if(requestModal?.id===ev.data.id)requestModal=null;break;
  }
  if(state.phase!=='intent'&&screen==='edit')screen='home';
  if(ev.kind!=='hello'&&ev.kind!=='syncAsk'){touch();if(state.phase!=='prayer')activeSessionAtStart=''}else save();
  render();
}
let snapshotDelay=null;function queueSnapshot(){clearTimeout(snapshotDelay);snapshotDelay=setTimeout(()=>{send('snapshot',{state,history:[]})},400)}
async function maybeReveal(){if(!my||state.phase!=='intent'||!state.commits.i||!state.commits.z||state.intents[my]!==null||!privateInt[state.session?.id]?.[my])return;await sendAndWait('intentReveal',{text:privateInt[state.session.id][my]})}
async function pushTo(to,title,message){const payload={topic:pushTopic(to),title,message,priority:4,tags:['heart']};try{const r=await fetch('https://ntfy.sh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('HTTP '+r.status);pushError=null;renderBanner()}catch(e){pushError=payload;renderBanner()}}
async function pushPartner(message){if(my)await pushTo(other(my),'Rosario de dos ❤️',message)}
async function pushIntentions(){if(!my||!state.intents.i||!state.intents.z)return;await pushTo(other(my),'Nuestras intenciones ❤️','Isaac: '+state.intents.i+'\nZayra: '+state.intents.z)}
async function onWire(data){try{const item=JSON.parse(data);if(item.event==='open')return;if(item.event!=='message'||!item.message)return;const ev=await decrypt(item.message);if(ev&&ev.kind)acceptEvent(ev)}catch(e){/* ignorar mensajes que no pertenecen a la sala cifrada */}}
function connect(){if(source)source.close();if(!key)return;source=new EventSource('https://ntfy.sh/'+room+'/sse?since=all');source.onopen=()=>{online=true;connectionError='';render();if(my){send('hello');send('syncAsk')}maybeReveal()};source.onmessage=e=>onWire(e.data);source.onerror=()=>{online=false;render()};if(heartbeat)clearInterval(heartbeat);heartbeat=setInterval(()=>{if(my&&online)send('hello');renderPeople()},25000)}
function peerOnline(w){return w===my?online:Date.now()-lastPeer[w]<75000}
function renderPeople(){const p=$('#people');if(!my){p.hidden=true;return}p.hidden=false;p.innerHTML=['i','z'].map(w=>`<div class="person"><b>${meNames[w]}</b><span class="muted"><i class="dot ${peerOnline(w)?'on':''}"></i>${peerOnline(w)?'Conectad'+(w==='i'?'o':'a'):'Desconectad'+(w==='i'?'o':'a')}</span></div>`).join('')}
function notice(txt){lastToast=txt;render();setTimeout(()=>{if(lastToast===txt){lastToast='';render()}},2200)}
function currentStep(){return PARTS[Math.min(state.step,TOTAL-1)]}
function heartGraphic(){let beads='',curve='';const n=Math.max(42,Math.min(TOTAL,150));for(let j=0;j<n;j++){const t=2*Math.PI*j/n;const x=150+6.15*(16*Math.pow(Math.sin(t),3));const y=145-5.65*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));curve+=(j?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';const idx=Math.round(j*(TOTAL-1)/(n-1));const o=PARTS[idx]?.o;const owner=o==='x'?'both':o==='a'?state.starter:other(state.starter);const cls=idx<state.step?owner:(idx===state.step?'current':'');beads+=`<circle class="bead ${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.8"/>`;}return `<svg class="heart-svg" viewBox="0 0 300 290" role="img" aria-label="Rosario en forma de corazón, avance ${state.step} de ${TOTAL}"><path class="heart-path" d="${curve}Z"/>${beads}<text x="150" y="155" fill="var(--both)" text-anchor="middle" font-size="15" font-family="Figtree">${Math.round(100*state.step/TOTAL)}%</text><text x="150" y="174" fill="var(--mute)" text-anchor="middle" font-size="9">Isaac ♥ Zayra</text></svg>`}
const welcome=()=>`<section class="card center appear"><div class="heart">♥</div><h2>Bienvenidos a su momento de oración</h2><p class="muted">Cuando estén listos, podrán comenzar un rosario juntos.</p><button class="btn full" data-action="propose">♥ Proponer nuevo rosario</button><button class="btn secondary full" data-action="calendar">♡ Nuestro historial</button></section>`;
function proposalView(){const p=state.proposal;if(!p)return welcome();if(p.by===my)return `<section class="card center"><div class="heart">♥</div><h2>Invitación enviada</h2><p>Esperando la respuesta de ${meNames[other(my)]} ❤️</p><button class="btn secondary full" data-action="cancel-proposal">Cancelar propuesta</button></section>`;return `<section class="card center"><div class="heart">♥</div><h2>Nuevo rosario propuesto por ${meNames[p.by]}</h2><div class="btnrow"><button class="btn secondary" data-action="decline">Rechazar</button><button class="btn" data-action="accept">Aceptar ❤️</button></div></section>`}
function mysteriesView(){const t=TORDER[state.mystery];let ch=state.change;return `<section class="card appear"><div class="center"><div class="heart">♥</div><span class="mini-label">Paso 1 de 3</span><h2>Confirmar los misterios</h2><h3>${esc(t[0].toUpperCase()+t.slice(1))}</h3></div><ol class="list">${TIPOS[t].map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${ch?(ch.by===my?`<p class="status">Esperando a ${meNames[other(my)]} ❤️</p>`:`<div class="soft"><b>${meNames[ch.by]} quiere cambiar los misterios.</b><div class="btnrow" style="margin-top:10px"><button class="btn secondary" data-action="change-no">Rechazar</button><button class="btn" data-action="change-yes">Aceptar</button></div></div>`):(state.confirmed[my]?`<p class="status">Esperando a ${meNames[other(my)]} ❤️</p>`:`<button class="btn full" data-action="mystery-approve">Confirmar misterios ❤️</button>`)}<button class="btn secondary full" data-action="select-mystery" ${ch?'disabled':''}>Solicitar cambio de misterios</button></section>`}
function intentView(){const own=privateInt[state.session?.id]?.[my]||'';if(state.commits[my])return `<section class="card center appear"><div class="heart">♥</div><h2>Tu intención está guardada ❤️</h2><p class="muted">Esperando a ${meNames[other(my)]} ❤️</p><p class="small">Mientras esperamos, ponemos este momento de oración en manos de Dios.</p><button class="btn secondary full" data-action="intent-edit">Editar mi intención</button><p class="note">🔒 Tu intención permanece privada hasta que ambos la guarden.</p></section>`;return `<section class="card appear"><div class="center"><div class="heart">♥</div><span class="mini-label">Paso 2 de 3</span><h2>Mi intención de oración</h2><p class="muted small">Escribe aquello que hoy deseas confiarle a Dios. ❤️</p></div><label for="intentField">Mi intención personal</label><textarea id="intentField" placeholder="Señor, hoy quiero ofrecer este rosario por...">${esc(own)}</textarea><button class="btn full" data-action="intent-save">Guardar mi intención ❤️</button><p class="note">🔒 Tu pareja no podrá verla hasta que ambos hayan guardado su intención.</p></section>`}
function intentCards(){return `<div class="pbox isaac appear"><b>♥ Intención de Isaac</b><p>${esc(state.intents.i)}</p></div><div class="pbox zayra appear"><b>♥ Intención de Zayra</b><p>${esc(state.intents.z)}</p></div>`}
function revealView(){return `<section class="card appear"><div class="center"><div class="heart">♥</div><h2>Nuestras intenciones ❤️</h2><p class="muted">Dos corazones, una misma oración.</p></div>${intentCards()}${state.revealReady[my]?`<p class="status">Esperando a ${meNames[other(my)]} ❤️</p>`:`<button class="btn full" data-action="reveal-next">Continuar ❤️</button>`}</section>`}
const offeringText='Señor, Dios nuestro, ponemos en tus manos este Santo Rosario. Recibe nuestra oración, nuestras alegrías y preocupaciones, y las intenciones que hoy compartimos. Por intercesión de la Santísima Virgen María, ayúdanos a crecer en la fe, la esperanza, la caridad y el amor verdadero. Amén.';
function offeringView(){return `<section class="card appear"><div class="center"><div class="heart">♥</div><span class="mini-label">Paso 3 de 3</span><h2>Ofrecimiento del Rosario</h2></div><div class="soft"><b>Oración de ofrecimiento</b><p class="prayer">${esc(offeringText)}</p></div>${intentCards()}${state.offeringReady[my]?`<p class="status">Esperando a ${meNames[other(my)]} ❤️</p>`:`<button class="btn full" data-action="offering-next">Continuar ❤️</button>`}</section>`}
function litanyBody(p){if(!p.title.startsWith('Letanías'))return '';const b=LETANIAS.findIndex(x=>x===p.body);return b>=0&&b<=10?`<p class="small muted">${b===0?RESP:''}</p>`:''}
function prayerView(){if(state.step>=TOTAL)return finishView();const p=currentStep(),owner=turnOwner(p),s=SECS.find(x=>state.step>=x.start&&state.step<x.start+x.len),set=state.mystery,idx=p.d;
const mys=idx>=0?`${ORDEN[idx]} misterio · ${TIPOS[TORDER[set]][idx]}`:s.key==='open'?'Oraciones iniciales':s.key==='close'?'Oraciones finales':'Fe, esperanza y caridad';
if(idx!==lastMystery){if(idx>=0)reflexOpen[idx]=true;lastMystery=idx}const reflection=idx>=0?REFLEXIONES[TORDER[set]][idx]:null;
const rb=reflection?`<details class="reflex" id="reflection" ${reflexOpen[idx]?'open':''}><summary>Reflexión</summary><div class="inner"><b>${esc(reflection[0])} · Reina-Valera 1909</b><p>${esc(reflection[1])}</p><p>${esc(reflection[2])}</p><p>${esc(reflection[3])}</p></div></details>`:'';
let bodies=p.body.map(b=>`<p class="prayer">${esc(b)}</p>`).join('');
if((p.title.includes('Ave María')||p.title.includes('Santa María'))&&p.sec!=='fe'){const a=p.o==='a',whoA=state.starter,whoB=other(whoA);bodies=`<div class="prayer half ${a?'active':''}"><span class="tag">${meNames[whoA]} · Dios te salve</span><div>${esc(PRAY.ave1)}</div></div><div class="prayer half ${!a?'active':''}"><span class="tag">${meNames[whoB]} · Santa María</span><div>${esc(PRAY.ave2)}</div></div>`}
if(p.title.startsWith('Letanías')){const blockNum=+(p.title.match(/(\d+) de/)||[])[1];const next=PARTS[state.step+1];bodies=`${blockNum===1?`<p class="note">${esc(RESP)}</p>`:''}<div class="prayer half active"><span class="tag">${meNames[owner]} · bloque ${blockNum}</span><div>${esc(p.body[0]||'')}</div></div>${next?.title.startsWith('Letanías')?`<div class="prayer half"><span class="tag">${meNames[turnOwner(next)]} · siguiente bloque</span><div>${esc(next.body[0]||'')}</div></div>`:''}`}
const waiting=owner==='x'&&state.stepDone[my]?`Esperando a ${meNames[other(my)]} ❤️`:owner!=='x'&&owner!==my?`Esperando a ${meNames[owner]} ❤️`:null;
const disabled=!online||inFlight||!!waiting||!!state.stepDone[my];
let view=`<div class="card center">${heartGraphic()}<div class="mystery-name">${esc(mys)}</div><div class="note">Oración ${state.step+1} de ${TOTAL}</div></div><section class="card" id="prayerCard"><span class="mini-label">${owner==='x'?'Oración de ambos':meNames[owner]+' · su turno'}</span><h2>${esc(p.title)}</h2>${bodies}${rb}<button class="btn ghost full" data-action="undo">↶ Deshacer avance anterior</button></section>`;
$('#bottom').hidden=false;$('#bottom').innerHTML=`<button class="btn" data-action="done" ${disabled?'disabled':''}>${!online?'Sin conexión · esperando':inFlight?'Guardando oración...':waiting||'Ya terminé'}</button>`;
return view}
function finishView(){return `<section class="card center appear"><div class="heart">♥</div><h2>Gracias por rezar juntos ❤️</h2><p class="prayer">Señor, gracias por permitirnos encontrarnos en la oración, incluso cuando la distancia nos separa. Bendice a Isaac y Zayra; fortalece nuestro amor, enséñanos a escucharnos y ayúdanos a caminar unidos hacia Ti. María, Madre nuestra, acompáñanos siempre. Amén.</p><button class="btn full" data-action="finished-home">Volver a la bienvenida</button><button class="btn secondary full" data-action="calendar">Ver nuestro historial</button></section>`}
function homeView(){return `<section class="card center"><div class="heart">♥</div><h2>¿Quién está entrando?</h2><p class="muted">Elige tu nombre para compartir este momento de oración.</p><div class="choices"><button class="choice isaac" data-action="choose" data-who="i">Soy Isaac</button><button class="choice zayra" data-action="choose" data-who="z">Soy Zayra</button></div></section>`}
function topButtons(){if(!my)return;$('#settingsButton').hidden=false;}
function render(){renderBanner();renderPeople();$('#settingsButton').hidden=!my;$('#bottom').hidden=true;$('#bottom').innerHTML='';let html='';if(!my)html=homeView();else if(screen==='calendar')html=calendarView();else if(screen==='settings')html=settingsView();else if(screen==='edit')html=editView();else if(!state.session)html=proposalView();else if(state.phase==='mysteries')html=mysteriesView();else if(state.phase==='intent')html=intentView();else if(state.phase==='reveal')html=revealView();else if(state.phase==='offering')html=offeringView();else if(state.phase==='prayer')html=prayerView();else if(state.phase==='finished')html=finishView();else html=welcome();$('#view').innerHTML=(lastToast?`<div class="soft small">${esc(lastToast)}</div>`:'')+html;if(requestModal)renderRequestModal();else $('#modal').hidden=true;}
function changeStep(){let p=currentStep(),owner=turnOwner(p);return owner==='x'||owner===my}
function editView(){const own=privateInt[state.session?.id]?.[my]||'';return `<section class="card"><div class="center"><div class="heart">♥</div><h2>Editar mi intención</h2></div><label for="intentEdit">Mi intención personal</label><textarea id="intentEdit">${esc(own)}</textarea><div class="btnrow"><button class="btn secondary" data-action="edit-cancel">Descartar cambios</button><button class="btn" data-action="edit-save">Guardar cambios</button></div></section>`}
function settingsView(){return `<section class="card"><h2>Ajustes</h2><details class="setting"><summary>👤 Mi identidad</summary><div>Estás usando el nombre <b>${meNames[my]}</b>.<button class="btn secondary full" data-action="switch-identity">Cambiar de persona</button></div></details><details class="setting"><summary>🎨 Apariencia y tamaño de letra</summary><div><label for="theme">Modo visual</label><select id="theme"><option value="auto" ${settings.theme==='auto'?'selected':''}>Automático</option><option value="light" ${settings.theme==='light'?'selected':''}>Claro</option><option value="dark" ${settings.theme==='dark'?'selected':''}>Oscuro</option></select><label for="fontsize">Tamaño de letra · ${settings.font}px</label><input type="range" id="fontsize" min="17" max="30" value="${settings.font}" style="width:100%"></div></details><details class="setting"><summary>🔔 Notificaciones ntfy</summary><div><p class="small">Suscríbete en ntfy a tu tema personal. Los avisos no contienen enlaces al rosario.</p><div class="pbox"><code>${esc(pushTopic(my))}</code></div><button class="btn secondary full" data-action="copy-topic">Copiar mi tema</button><a class="btn secondary full" href="https://ntfy.sh/app" target="_blank" rel="noopener">Abrir ntfy</a><p class="note">No se envían notificaciones de prueba. Necesitas autorizar sonido y vibración desde tu celular.</p></div></details><details class="setting"><summary>♡ Nuestra sala</summary><div><p class="small">Este mismo enlace sirve para Isaac y Zayra.</p><button class="btn secondary full" data-action="copy-link">Copiar enlace permanente</button><p class="note">Conserva el enlace completo con #s=. Quien lo tenga podrá entrar; elegir el nombre no verifica la identidad.</p><p>Conexión: <b>${online?'Conectada':'Sin conexión'}</b></p><button class="btn secondary full" data-action="sync">Sincronizar ahora</button></div></details><details class="setting"><summary>📖 Misterios y rosario</summary><div><p>Los misterios del día se confirman entre ambos antes de comenzar. El cambio requiere el consentimiento de los dos.</p></div></details><details class="setting"><summary>🗓️ Historial</summary><div><button class="btn secondary full" data-action="calendar">Abrir calendario</button><button class="btn secondary full" data-action="request-history">Solicitar recuperar historial del otro celular</button><p class="note">Los registros se guardan en cada dispositivo. Tu pareja deberá aprobar la transferencia.</p></div></details><button class="btn secondary full" data-action="go-home">Volver</button></section>`}
function calendarView(){const yr=currentMonth.getFullYear(),mo=currentMonth.getMonth(),start=new Date(yr,mo,1).getDay(),days=new Date(yr,mo+1,0).getDate(),names=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];let cell=names.map(x=>`<div class="center micro muted">${x}</div>`).join('');for(let j=0;j<start;j++)cell+='<div class="day hollow"></div>';for(let day=1;day<=days;day++){const dateKey=new Date(yr,mo,day).toLocaleDateString('en-CA');const entries=historyItems.filter(h=>!deleted[h.id]&&new Date(h.date).getFullYear()===yr&&new Date(h.date).getMonth()===mo&&new Date(h.date).getDate()===day);cell+=`<button class="day ${entries.length?'has':''}" data-action="date" data-day="${day}"><div>${day}</div><div class="hearts">${'♥'.repeat(Math.min(entries.length,7))}</div></button>`}return `<section class="card"><div class="calhead"><button class="btn secondary" data-action="month-prev">‹</button><h2>${new Date(yr,mo,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</h2><button class="btn secondary" data-action="month-next">›</button></div><div class="cal">${cell}</div><div id="calendarDetail" style="margin-top:12px"></div><button class="btn secondary full" data-action="request-history">Recuperar historial de mi pareja</button><button class="btn secondary full" data-action="go-home">Volver</button></section>`}
function dateDetail(day){const list=historyItems.filter(h=>!deleted[h.id]&&new Date(h.date).getFullYear()===currentMonth.getFullYear()&&new Date(h.date).getMonth()===currentMonth.getMonth()&&new Date(h.date).getDate()===day);$('#calendarDetail').innerHTML=list.length?list.map(h=>`<div class="entry"><b>${esc(TORDER[h.mystery])} · ${new Date(h.date).toLocaleString('es-MX')}</b><p class="small">Empezó: ${meNames[h.starter]} · Terminó: ${new Date(h.end).toLocaleString('es-MX')}</p><p class="small"><b>Isaac:</b> ${esc(h.intents?.i)}</p><p class="small"><b>Zayra:</b> ${esc(h.intents?.z)}</p><button class="btn secondary" data-action="delete-history" data-id="${esc(h.id)}">Solicitar eliminación</button></div>`).join(''):'<p class="muted small">No hay rosarios registrados en esta fecha.</p>'}
function renderRequestModal(){const m=requestModal;if(!m)return;$('#modal').hidden=false;let title='',body='',actions='';if(m.type==='transfer'){title='Solicitud de historial';body=`${meNames[m.from]} quiere recuperar su historial desde tu celular. ¿Autorizar la transferencia?`;actions='<button class="btn secondary" data-action="request-no">No</button><button class="btn" data-action="transfer-yes">Autorizar</button>'}else if(m.type==='undo'){title='Deshacer oración';body=`${meNames[m.from]} solicita regresar a la oración anterior. ¿Lo autorizas?`;actions='<button class="btn secondary" data-action="undo-no">Rechazar</button><button class="btn" data-action="undo-yes">Aceptar</button>'}else if(m.type==='delete'){title='Eliminar un rosario';body=`${meNames[m.from]} solicita eliminar este registro del historial de ambos celulares.`;actions='<button class="btn secondary" data-action="delete-no">Rechazar</button><button class="btn warn" data-action="delete-yes">Aprobar</button>'}$('#modalContent').innerHTML=`<h2>${esc(title)}</h2><p>${esc(body)}</p><div class="btnrow">${actions}</div>`}
async function doAction(action,el){if(!action)return;
switch(action){
case'choose':my=el.dataset.who;screen='home';lastPeer[my]=Date.now();render();if(online){send('hello');send('syncAsk')}return;
case'switch-identity':my=null;screen='home';render();return;
case'propose':{const ok=await sendAndWait('propose',{id:uid(),starter:historyItems.length%2===0?'i':'z'});if(ok)pushPartner(meNames[my]+' quiere rezar el rosario contigo. ❤️');return}
case'cancel-proposal':await sendAndWait('cancel',{id:state.proposal?.id});return;
case'decline':await sendAndWait('decline',{id:state.proposal?.id});return;
case'accept':await sendAndWait('accept',{id:state.proposal?.id});return;
case'mystery-approve':await sendAndWait('mysteryApprove');return;
case'select-mystery':{$('#modal').hidden=false;$('#modalContent').innerHTML=`<h2>Solicitar cambio</h2><label for="changeType">Elige los misterios</label><select id="changeType">${TORDER.map((x,i)=>`<option value="${i}" ${i===state.mystery?'selected':''}>${x}</option>`).join('')}</select><button class="btn full" data-action="request-change">Enviar solicitud</button>`;return}
case'request-change':{const typ=Number($('#changeType').value);$('#modal').hidden=true;if(typ!==state.mystery)await sendAndWait('changeRequest',{type:typ});return}
case'change-yes':await sendAndWait('changeDecision',{accept:true});return;
case'change-no':await sendAndWait('changeDecision',{accept:false});return;
case'intent-save':{let val=$('#intentField')?.value.trim();if(!val){notice('Escribe tu intención antes de guardarla.');return}if(!privateInt[state.session.id])privateInt[state.session.id]={};privateInt[state.session.id][my]=val;save();await sendAndWait('intentCommit');return}
case'intent-edit':screen='edit';render();return;
case'edit-save':{if(state.phase!=='intent'||(state.commits.i&&state.commits.z)){screen='home';render();return}const v=$('#intentEdit')?.value.trim();if(!v){notice('Tu intención no puede estar vacía.');return}privateInt[state.session.id][my]=v;save();screen='home';render();return}
case'edit-cancel':screen='home';render();return;
case'reveal-next':await sendAndWait('revealNext');return;
case'offering-next':await sendAndWait('offeringNext');return;
case'done':{if(!changeStep()||state.stepDone[my])return;const pos=state.step;const r=await sendAndWait('done',{step:pos});if(r){notice('❤️ Tu oración quedó registrada');if(state.phase!=='finished')pushPartner('Mi amor, '+meNames[my]+' terminó su oración. Sigamos rezando juntos. 🙏📿')}return}
case'undo':{if(state.step<=0)return notice('No existe una oración anterior para deshacer.');await sendAndWait('undoAsk',{step:Math.max(0,state.step-1)});notice('Solicitud de deshacer enviada a tu pareja.');return}
case'finished-home':await sendAndWait('newFromFinished');return;
case'calendar':screen='calendar';render();return;
case'month-prev':currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);render();return;
case'month-next':currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+1,1);render();return;
case'date':dateDetail(Number(el.dataset.day));return;
case'go-home':screen='home';render();return;
case'copy-link':await copy(location.href);return;
case'copy-topic':await copy(pushTopic(my));return;
case'sync':if(online){await send('syncAsk');notice('Solicitud de sincronización enviada.')}return;
case'retry-push':if(pushError){const x=pushError;await pushTo(x.topic.endsWith('-1')?'i':'z',x.title,x.message)}return;
case'request-history':await sendAndWait('historyRequest',{request:uid()});notice('Se solicitó la recuperación. Tu pareja debe aprobarla.');return;
case'delete-history':{const id=el.dataset.id;if(!online){notice('Necesitas conexión para solicitar eliminación.');return}await sendAndWait('deleteAsk',{id});notice('Esperando aprobación de tu pareja ❤️');return}
case'transfer-yes':{const r=requestModal;requestModal=null;$('#modal').hidden=true;for(const h of historyItems.filter(h=>!deleted[h.id]))await sendAndWait('historyTransfer',{to:r.from,items:[h]});return}
case'delete-yes':{const r=requestModal;requestModal=null;$('#modal').hidden=true;await sendAndWait('deleteApprove',{id:r.id});return}
case'undo-yes':requestModal=null;$('#modal').hidden=true;await sendAndWait('undoDecision',{accept:true});return;
case'undo-no':requestModal=null;$('#modal').hidden=true;await sendAndWait('undoDecision',{accept:false});return;
case'delete-no':{const r=requestModal;requestModal=null;$('#modal').hidden=true;await sendAndWait('deleteReject',{id:r.id});return}
case'request-no':requestModal=null;$('#modal').hidden=true;return;
case'modal-close':requestModal=null;$('#modal').hidden=true;return;
}}
async function copy(s){try{await navigator.clipboard.writeText(s);notice('Copiado ❤️')}catch{const inp=document.createElement('textarea');inp.value=s;document.body.appendChild(inp);inp.select();document.execCommand('copy');inp.remove();notice('Copiado ❤️')}}
$('#settingsButton').addEventListener('click',()=>{screen='settings';render()});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn)doAction(btn.dataset.action,btn)});
document.addEventListener('toggle',e=>{if(e.target?.id==='reflection'&&state.phase==='prayer'){const p=currentStep();if(p?.d>=0)reflexOpen[p.d]=e.target.open}},true);
document.addEventListener('change',e=>{if(e.target.id==='theme'){settings.theme=e.target.value;save();applySettings()}else if(e.target.id==='fontsize'){settings.font=Number(e.target.value);save();applySettings();render()}});
window.addEventListener('online',()=>{if(source)connect()});window.addEventListener('offline',()=>{online=false;render()});
(async()=>{if(!window.crypto?.subtle||!window.EventSource){showError('Para sincronizar necesitas HTTPS y un navegador moderno.');render();return}await derive();render();connect()})().catch(e=>{showError('No se pudo preparar el cifrado: '+e.message);render()});
})();

</script></body></html>
